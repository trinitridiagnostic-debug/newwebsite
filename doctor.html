<body class="drapp">
<div id="login" class="login" hidden>
  <form id="fl" novalidate autocomplete="on">
    <img src="icon.png" alt="" width="56" height="56">
    <h1>Trinetri Diagnostics</h1>
    <p class="sub">Doctor partner login</p>
    <label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none">

    <p class="msg" id="lmsg" role="status"></p>
  </form>
</div>

  <header class="top" id="top"></header>
  <main id="page"></main>
</div>
<div class="toast" id="toast" hidden></div>
